name: Full checks

# Manual-only heavy suite (proof, audits, Lighthouse, Playwright).
# PR CI is the fast safety net in ci.yml; run this before releases if needed.
on:
  workflow_dispatch:

concurrency:
  group: full-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SITE_URL: https://file-converter-tools.hammadiqbal117.workers.dev
  PUBLIC_GSC_VERIFICATION: 0-q_NxhBgfgCm4WOLfbe9VrHrjbLzaxh8SXsbo2Q-UU
  PUBLIC_GA4_MEASUREMENT_ID: G-L73MEN86ZY
  PUBLIC_INDEXNOW_KEY: e0d80dcb289204f10564144f215e4a8e
  INDEXNOW_KEY: e0d80dcb289204f10564144f215e4a8e

jobs:
  proof-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      # build + test + audit (SEO/AdSense/bundles/link-check) + committed docs/proof/
      - run: npm run proof:verify

  page-checklist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run audit:pages

  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      - run: npm run lighthouse

  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22'
          cache: npm
      - run: npm ci
      # No --with-deps: browsers only; keeps the job lighter on Ubuntu runners.
      - run: npx playwright install chromium
      - run: npm run proof
